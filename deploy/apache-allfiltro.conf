# Central de Listas ALL Filtros - Apache (o HAProxy do escritorio faz o HTTPS e encaminha para ca)
<VirtualHost *:80>
    ServerName allfiltro.alltecnologias.com.br
    ServerAlias *

    # arquivos do painel direto do disco
    Alias /static/ /opt/allfiltro/app/allfiltro/web/static/
    <Directory /opt/allfiltro/app/allfiltro/web/static/>
        Require all granted
        Options -Indexes
    </Directory>

    # landing, /admin e /api -> app (uvicorn so em 127.0.0.1)
    ProxyPreserveHost On
    # o HAProxy informa o esquema original; acesso direto ao LXC (rede interna) fica como http
    RequestHeader setifempty X-Forwarded-Proto "http"
    ProxyPass        /static/ !
    ProxyPass        / http://127.0.0.1:8001/ timeout=120
    ProxyPassReverse / http://127.0.0.1:8001/

    # listas: a app confere a chave e responde X-Sendfile; o Apache entrega o arquivo
    # (com retomada de download), sem ocupar a app com dezenas de MB
    XSendFile On
    XSendFilePath /srv/allfiltro/versoes

    # o HTTPS termina no HAProxy
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 12582912
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/allfiltro-erro.log
    CustomLog ${APACHE_LOG_DIR}/allfiltro-acesso.log combined
</VirtualHost>
